server:
  port: 1910

spring:
  application:
    name: jarvis-be

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/jarvis

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma4:e4b
          temperature: 0.1
          num-ctx: 8192
      embedding:
        options:
          model: bge-m3
    vectorstore:
      pgvector:
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: true

logging:
  level:
    org.springframework.ai: INFO